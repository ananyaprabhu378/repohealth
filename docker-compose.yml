
services:
  postgres:
    image: postgres:15
    container_name: aethergraph-postgres
    environment:
      POSTGRES_USER: aethergraph
      POSTGRES_PASSWORD: aethergraph_password
      POSTGRES_DB: aethergraph
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: aethergraph-redis
    ports:
      - "6379:6379"
    restart: unless-stopped

volumes:
  postgres_data:
